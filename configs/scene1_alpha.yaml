# Single sphere, used by scripts/run_alpha.py for tangent-angle sweeps.
simulation:
  tsim: 100
  dt: 0.1
  rtsim: 50
  sim_mode: BY_DISTANCE

scenario:
  scene: 1

ifds:
  rho0_initial: 1.0
  sigma0_initial: 1.0
  use_optimizer: OFF
  rg: 0.0

weather:
  k: 0.5
  env: static

uav:
  c: 10.0
  start: [0.0, 0.0, 50.0]
  final: [200.0, 0.0, 50.0]
  pose: {x: 0.0, y: 0.0, z: 50.0, psi: 0.0, gamma: 0.0}

cca:
  preset: 5
