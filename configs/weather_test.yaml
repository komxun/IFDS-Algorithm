# Minimal IFDS + weather sanity demo (port of for_experimenting/weather_test.m).
simulation:
  tsim: 400
  dt: 0.1
  rtsim: 1
  sim_mode: BY_TIME
  target_thresh: 2.5

scenario:
  scene: 0

ifds:
  rho0_initial: 0.5
  sigma0_initial: 0.01
  use_optimizer: OFF
  rg: 5.0

weather:
  k: 1.0
  b_u: 0.7
  b_l: 0.0
  env: dynamic

uav:
  c: 30.0
  start: [0.0, 0.0, 0.0]
  final: [200.0, 0.0, 10.0]
  pose: {x: 0.0, y: 0.0, z: 0.0, psi: 0.0, gamma: 0.0}

cca:
  preset: 5
